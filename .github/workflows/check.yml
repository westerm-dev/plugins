name: Check

# Checks index.json and downloads every package it lists. It also runs every
# day, because a package can change at its address after a merge.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
      - run: node scripts/check-index.mjs index.json
